# CẤU HÌNH NGINX TRÊN VM GATEWAY (192.168.56.10)
# Chép vào /etc/nginx/sites-available/vb rồi bật (xem tài liệu, phần Gateway).

# Nhóm máy chủ phục vụ phần ĐỌC (xác minh, tra cứu). nginx chia đều request cho các máy trong nhóm (round-robin).
# MỞ RỘNG: thêm node chỉ đọc = bỏ dấu # ở dòng tương ứng, rồi chạy: sudo nginx -s reload
upstream vb_read {
    server 192.168.56.11:3000;
    server 192.168.56.12:3000;
    server 192.168.56.13:3000;
    # server 192.168.56.21:3000;
    # server 192.168.56.22:3000;
}

server {
    listen 80;
    root /var/www/vb;            # các file giao diện: index.html, style.css, app.js ...
    index index.html;
    client_max_body_size 20m;    # cho phép tải PDF tới 20 MB

    # Đọc: chia tải cho cả nhóm vb_read. Một máy không trả lời sau 2 giây → nginx chuyển yêu cầu sang máy khác
    location /api/ {
        proxy_pass http://vb_read/;
        proxy_connect_timeout 2s;
    }

    # Ghi (cấp/thu hồi/cấp quyền) và Block Explorer: gọi đúng một node
    location /n1/ { proxy_pass http://192.168.56.11:3000/; }
    location /n2/ { proxy_pass http://192.168.56.12:3000/; }
    location /n3/ { proxy_pass http://192.168.56.13:3000/; }
    location /r1/ { proxy_pass http://192.168.56.21:3000/; }
    location /r2/ { proxy_pass http://192.168.56.22:3000/; }
}
